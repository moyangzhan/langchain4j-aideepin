server {
    listen 80;
    server_name localhost;
    charset utf-8;
    proxy_buffering off;
    error_page 500 502 503 504 /50x.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Docker built-in DNS; with variable-style proxy_pass below, nginx re-resolves upstream
    # container IPs every valid period, avoiding 502 from stale cached IPs after container recreate
    resolver 127.0.0.11 valid=10s;

    # Backend API
    location /api/ {
        set $upstream_api aideepin-api;
        rewrite ^/api/(.*)$ /$1 break;   # 变量式 proxy_pass 不自动去 location 前缀，需显式 rewrite
        proxy_pass http://$upstream_api:9999;
    }

    # Admin Web
    location /admin/ {
        set $upstream_admin aideepin-admin-web;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$upstream_admin:80;
    }

    # User Web
    location / {
        set $upstream_user aideepin-user-web;
        proxy_pass http://$upstream_user:80;
    }
}
